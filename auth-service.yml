server:
  port: 8081
spring:
  datasource:
    url: jdbc:h2:mem:authdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

oauth2:
  facebook:
    client-id: ${FACEBOOK_CLIENT_ID:your-facebook-client-id}
    client-secret: ${FACEBOOK_CLIENT_SECRET:your-facebook-client-secret}
---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://mysql-auth:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: Raajesh
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
  h2:
    console:
      enabled: false
  rabbitmq:
    host: rabbitmq
  data:
    redis:
      host: redis
