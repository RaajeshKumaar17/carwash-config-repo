server:
  port: 8085
spring:
  datasource:
    url: jdbc:h2:mem:paymentdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

braintree:
  merchant-id: ${BRAINTREE_MERCHANT_ID:sandbox_merchant_id}
  public-key: ${BRAINTREE_PUBLIC_KEY:sandbox_public_key}
  private-key: ${BRAINTREE_PRIVATE_KEY:sandbox_private_key}
  environment: sandbox
---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://mysql-payment:3306/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: Raajesh
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
  rabbitmq:
    host: rabbitmq
  data:
    redis:
      host: redis
